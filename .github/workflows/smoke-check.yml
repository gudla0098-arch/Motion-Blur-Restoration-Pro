name: CI — Motion Blur Restoration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q backend api
      - name: Check JavaScript syntax
        run: node --check motion-blur.js
      - name: Verify API routes and restoration kernels
        run: |
          python - <<'PY'
          import numpy as np
          from backend.main import app, _motion_kernel, _wiener_restore
          routes = {route.path for route in app.routes}
          assert {"/api/motion-blur", "/api/result/{filename}", "/", "/motion-blur"} <= routes
          for model in ("linear", "circular", "uniform", "non-uniform"):
              kernel = _motion_kernel(model, 9, 35)
              assert np.isclose(kernel.sum(), 1.0)
          sample = np.full((64, 64, 3), 120, dtype=np.uint8)
          restored = _wiener_restore(sample, _motion_kernel("linear", 9, 0), 0.008)
          assert restored.shape == sample.shape
          print("Motion Blur restoration smoke checks passed.")
          PY
